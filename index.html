<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10110e" />
    <title>音高练习</title>
  </head>
  <body>
    <div class="app">
    <nav class="modes" aria-label="练习">
      <button class="mode" type="button" data-mode="tuner" aria-pressed="true">音高朗读</button>
      <button class="mode" type="button" data-mode="pharyngeal" aria-pressed="false">咽音练习</button>
    </nav>
    <main class="stage" id="stage" data-state="idle">
      <header>
        <p class="eyebrow">单音练习</p>
        <h1>音高朗读</h1>
        <p class="lede">唱稳一个音，就念出音名。不用盯着屏幕。</p>
      </header>

      <section class="readout">
        <p id="note" class="note is-empty">·</p>
        <p id="detail" class="detail">打开麦克风，唱一个音</p>
        <div class="ruler" aria-hidden="true">
          <div class="track">
            <div class="zone"></div>
          </div>
          <div id="mark" class="mark" hidden></div>
          <div class="scale">
            <span>−50</span>
            <span>准</span>
            <span>+50</span>
          </div>
        </div>
        <p id="spoken" class="spoken" aria-live="assertive"></p>
      </section>

      <div class="meter" title="输入响度">
        <div id="level" class="meter-level"></div>
        <div id="gate-mark" class="meter-gate"></div>
      </div>

      <div class="actions">
        <button id="listen" class="primary" type="button" aria-pressed="false">开始听</button>
        <button id="self-test" class="ghost" type="button">试听 G3</button>
      </div>
      <p class="hint">请戴耳机。念出来的声音如果回到麦克风里，会干扰下一个音。</p>

      <details class="settings">
        <summary>调节</summary>
        <label>
          稳住才念
          <input id="hold" type="range" min="200" max="800" step="20" value="320" />
          <span id="hold-value">0.32 秒</span>
        </label>
        <label>
          响度门限
          <input id="gate" type="range" min="1" max="40" step="1" value="8" />
          <span id="gate-value">适中</span>
        </label>
        <p>
          电平要越过门限上的白点，音高再稳住，才会出声。停大约半秒再唱，同一个音会再念一次。房间吵的时候，把门限往右拨。滑音经过的音不会每个都念。
        </p>
      </details>

      <p id="status" class="status" role="status"></p>
    </main>

    <main class="stage is-flow" id="pharyngeal" hidden>
      <header>
        <p class="eyebrow">咽音练习</p>
        <h1 id="ph-title">咽音哼鸣练习</h1>
        <p class="lede" id="ph-lede">正常发声时，口腔在振动。软腭有振动。</p>
      </header>

      <div class="modes exercise-switch" role="group" aria-label="练习内容">
        <button class="mode" id="ph-hum" type="button" aria-pressed="true">哼鸣</button>
        <button class="mode" id="ph-flex" type="button" aria-pressed="false">灵活性</button>
      </div>

      <div class="group-head">
        <p id="ph-part" class="part">第一部分 · 上行</p>
        <p id="ph-group" class="group-label">第 1 组</p>
      </div>
      <ol id="ph-notes" class="scale-row"></ol>

      <section class="readout ph-readout">
        <p id="ph-note" class="note is-empty">·</p>
        <p id="ph-detail" class="detail">播放音阶，然后唱到最高音</p>
        <p id="ph-highest" class="spoken" aria-live="assertive"></p>
      </section>

      <div class="meter" title="输入响度">
        <div id="ph-level" class="meter-level"></div>
      </div>

      <div class="actions">
        <button id="ph-play" class="primary" type="button">播放并跟唱</button>
      </div>
      <div class="actions">
        <button id="ph-prev" class="ghost" type="button">上一组</button>
        <button id="ph-next" class="ghost" type="button">下一组</button>
      </div>
      <p class="hint">音阶播完再开口。唱完停一下，会念出你够到的最高音。请戴耳机，免得音阶被麦克风听进去。</p>
      <p id="ph-status" class="status" role="status"></p>
    </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
